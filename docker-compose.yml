name: ir-project

# Port policy (§4): only THREE containers publish a host port —
#   • api-gateway   (:8000)  the single external door for the product/API
#   • dashboard     (:8090)  dev/QA Verification Console (documented exception)
#   • mongo-express (:8081)  DB admin UI (documented exception)
# Every functional service + MongoDB is internal-only (``expose`` = compose network
# only); reach them through the gateway, or the console's reverse proxy.
services:
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: ir-project/api-gateway
    container_name: ir-api-gateway
    env_file:
      - path: .env
        required: true
    # The ONLY product-facing port — the single external entry point.
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    networks:
      - ir-net
    restart: unless-stopped

  preprocessing-service:
    build:
      context: .
      dockerfile: services/preprocessing-service/Dockerfile
    image: ir-project/preprocessing-service
    container_name: ir-preprocessing
    env_file:
      - path: .env
        required: true
    # Internal-only: reachable on the compose network at preprocessing-service:8001.
    # Not published to the host — the API Gateway is the single external door (§4).
    expose:
      - "8001"
    networks:
      - ir-net
    restart: unless-stopped

  indexing-service:
    build:
      context: .
      dockerfile: services/indexing-service/Dockerfile
    image: ir-project/indexing-service
    container_name: ir-indexing
    env_file:
      - path: .env
        required: true
    # Internal-only: reachable on the compose network at indexing-service:8002.
    # Not published to the host — the API Gateway is the single external door (§4).
    expose:
      - "8002"
    # Heavy artifacts (inverted index) persist on the host volume.
    volumes:
      - ./data:/app/data
    depends_on:
      preprocessing-service:
        condition: service_healthy
      doc-store-service:      # the index is built from the docs stored in the doc-store
        condition: service_healthy
    networks:
      - ir-net
    restart: unless-stopped

  representation-service:
    build:
      context: .
      dockerfile: services/representation-service/Dockerfile
    image: ir-project/representation-service
    container_name: ir-representation
    env_file:
      - path: .env
        required: true
    # Internal-only: reachable on the compose network at representation-service:8003.
    # Not published to the host — the API Gateway is the single external door (§4).
    expose:
      - "8003"
    # Heavy artifacts (TF-IDF matrix + fitted model) persist on the host volume.
    volumes:
      - ./data:/app/data
    depends_on:
      preprocessing-service:
        condition: service_healthy
      doc-store-service:      # the representation is fitted from the docs in the store
        condition: service_healthy
    networks:
      - ir-net
    restart: unless-stopped

  retrieval-service:
    build:
      context: .
      dockerfile: services/retrieval-service/Dockerfile
    image: ir-project/retrieval-service
    container_name: ir-retrieval
    env_file:
      - path: .env
        required: true
    # Internal-only: reachable on the compose network at retrieval-service:8004.
    # Not published to the host — the API Gateway is the single external door (§4).
    expose:
      - "8004"
    # Owns no artifacts (no data volume): it asks the representation-service for
    # per-model scores and reads original docs by id from the doc-store.
    depends_on:
      representation-service:    # does the per-model scoring (/rank, /score)
        condition: service_healthy
      doc-store-service:         # original docs read by id for display
        condition: service_healthy
    networks:
      - ir-net
    restart: unless-stopped

  clustering-service:
    build:
      context: .
      dockerfile: services/clustering-service/Dockerfile
    image: ir-project/clustering-service
    container_name: ir-clustering
    env_file:
      - path: .env
        required: true
    # Internal-only: reachable on the compose network at clustering-service:8008.
    # Not published to the host — the API Gateway is the single external door (§4).
    expose:
      - "8008"
    # Heavy artifact (fitted TF-IDF + KMeans) persists on the host volume.
    volumes:
      - ./data:/app/data
    depends_on:
      doc-store-service:          # clusters the raw docs stored in the doc-store
        condition: service_healthy
    networks:
      - ir-net
    restart: unless-stopped

  query-refinement-service:
    build:
      context: .
      dockerfile: services/query-refinement-service/Dockerfile
    image: ir-project/query-refinement-service
    container_name: ir-query-refinement
    env_file:
      - path: .env
        required: true
    # Internal-only: reachable on the compose network at query-refinement-service:8005.
    # Not published to the host — the API Gateway is the single external door (§4).
    expose:
      - "8005"
    # Owns no artifacts: resources (SymSpell dict + WordNet) are baked into the image
    # and loaded at startup; it refines the raw query and returns a refined string.
    networks:
      - ir-net
    restart: unless-stopped

  evaluation-service:
    build:
      context: .
      dockerfile: services/evaluation-service/Dockerfile
    image: ir-project/evaluation-service
    container_name: ir-evaluation
    env_file:
      - path: .env
        required: true
    # Internal-only: reachable on the compose network at evaluation-service:8006.
    # Not published to the host — the API Gateway is the single external door (§4).
    expose:
      - "8006"
    # Persists evaluation reports (JSON + CSV) under the data volume so they survive
    # restarts and feed the report's charts (data/artifacts/eval).
    volumes:
      - ./data:/app/data
    depends_on:
      retrieval-service:        # runs the test queries being evaluated
        condition: service_healthy
      doc-store-service:        # source of the test queries & qrels (ground truth)
        condition: service_healthy
    networks:
      - ir-net
    restart: unless-stopped

  doc-store-db:
    image: mongo:7
    container_name: ir-doc-store-db
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DB:-ir_project}
    # MongoDB engine files under ./data/mongo so ALL long-term data lives in the
    # project folder (bind mount, per project preference). Note: if Mongo fails to
    # start on a Windows host FS (WiredTiger needs POSIX locking), fall back to a
    # named volume — the raw docs are re-ingestable via /dataset/prepare anyway.
    volumes:
      - ./data/mongo:/data/db
    # Internal-only: reachable on the compose network at doc-store-db:27017. Not
    # published to the host — browse it via mongo-express, or the gateway/doc-store API.
    expose:
      - "27017"
    # Mongo ships no built-in HEALTHCHECK, so define one — dependents gate on it via
    # ``condition: service_healthy`` (a ping that passes only once mongod accepts
    # connections) instead of starting the instant the container exists.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ir-net
    restart: unless-stopped

  doc-store-service:
    build:
      context: .
      dockerfile: services/doc-store-service/Dockerfile
    image: ir-project/doc-store-service
    container_name: ir-doc-store
    env_file:
      - path: .env
        required: true
    # Internal-only: reachable on the compose network at doc-store-service:8007.
    # Not published to the host — the API Gateway is the single external door (§4).
    expose:
      - "8007"
    # Reads the shared ir-datasets cache (./data) as the raw-text source for ingest.
    volumes:
      - ./data:/app/data
    depends_on:
      doc-store-db:
        condition: service_healthy
    networks:
      - ir-net
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: ir-mongo-express
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: doc-store-db
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      doc-store-db:
        condition: service_healthy
    networks:
      - ir-net
    restart: unless-stopped

  # Verification Console — observability/admin UI (like mongo-express). Serves the
  # dashboard and reverse-proxies every service so the browser has one origin (no
  # CORS) and each service can be exercised independently. NOT the graded product UI.
  dashboard-service:
    build:
      context: .
      dockerfile: services/dashboard-service/Dockerfile
    image: ir-project/dashboard-service
    container_name: ir-dashboard
    env_file:
      - path: .env
        required: true
    ports:
      - "${DASHBOARD_PORT:-8090}:8090"
    # Live-edit the dashboard UI without rebuilding the image (served from disk by
    # StaticFiles) — just refresh the browser. The image still bakes a copy in.
    volumes:
      - ./services/dashboard-service/frontend:/app/frontend:ro
    # Ordering only — the console tolerates any service being down (shows it offline).
    depends_on:
      - api-gateway
      - preprocessing-service
      - indexing-service
      - representation-service
      - retrieval-service
      - query-refinement-service
      - clustering-service
      - evaluation-service
      - doc-store-service
    networks:
      - ir-net
    restart: unless-stopped

networks:
  ir-net:
    driver: bridge
